; Grafana settings managed by this repository. monitoring/install.sh writes each key into
; /etc/grafana/grafana.ini (in its section) and keeps every other line of that file untouched.
; names between double @ signs are inventory.env values

[server]
http_port = @@GRAFANA_PORT@@
domain = @@DASHBOARD_NAME@@
root_url = http://@@DASHBOARD_NAME@@/

[smtp]
; Alerts are relayed by Postfix on the application server, through Tailscale (no password, no TLS on this private link).
enabled = true
host = @@APP_TS_IP@@:25
user =
password =
from_address = supervision@@@MON_HOST_NAME@@.local
from_name = Supervision Odoo
startTLS_policy = NoStartTLS
skip_verify = false
